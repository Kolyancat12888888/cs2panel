# ====================================================================
# CS2Panel Production Nginx Configuration
# Domain: cs2.hfl-nodes.pro
# Ports: 80 (HTTP), 443 (HTTPS)
# Backend: http://127.0.0.1:8005 (Laravel API)
# Frontend: http://127.0.0.1:3002 (Next.js)
# ====================================================================

# Upstream definitions
upstream cs2_backend {
    server 127.0.0.1:8005;
    keepalive 32;
}

upstream cs2_frontend {
    server 127.0.0.1:3002;
    keepalive 32;
}

# --------------------------------------------------------------------
# 1. HTTP Server (Port 80)
# Supports ACME Let's Encrypt validation and proxies / redirects
# --------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 31.77.8.9:80;
    server_name cs2.hfl-nodes.pro www.cs2.hfl-nodes.pro;

    # Let's Encrypt ACME Challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS once SSL certificate is active
    # (If SSL cert is not yet generated, comment out the redirect below and uncomment the include block)
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------
# 2. HTTPS Server (Port 443)
# SSL / TLS 1.2 & 1.3 with HTTP/2 and WebSocket Support
# --------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 31.77.8.9:443 ssl http2;
    server_name cs2.hfl-nodes.pro www.cs2.hfl-nodes.pro;

    # SSL Certificates (Managed automatically by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/cs2.hfl-nodes.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs2.hfl-nodes.pro/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/cs2.hfl-nodes.pro/chain.pem;

    # SSL Protocols & Ciphers (Modern Security Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client payload & buffer settings
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ----------------------------------------------------------------
    # Let's Encrypt Challenge
    # ----------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # Backend API Routing -> Laravel on Port 8005
    # ----------------------------------------------------------------
    location ~ ^/(api|auth|agent-gateway|sanctum|broadcasting|storage)/ {
        proxy_pass http://cs2_backend;
        proxy_http_version 1.1;

        # WebSocket & Persistent Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for long-running agent & AI generations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ----------------------------------------------------------------
    # Node Daemon API & Direct WebSocket for Real-time Console logs
    # ----------------------------------------------------------------
    location /daemon/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ----------------------------------------------------------------
    # Frontend Routing -> Next.js on Port 3002
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://cs2_frontend;
        proxy_http_version 1.1;

        # WebSocket & HMR headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://cs2_frontend;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }
}

# WebSocket connection mapping helper (placed in http context or main config)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
