upstream cs2_backend {
    server 127.0.0.1:8005;
    keepalive 32;
}

upstream cs2_frontend {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream cs2_daemon {
    server 127.0.0.1:8888;
    keepalive 32;
}

# 1. HTTP (Port 80) -> Редирект на HTTPS
server {
    server_name cs2.hfl-nodes.pro www.cs2.hfl-nodes.pro;
    listen 31.77.8.9:80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (Port 443) -> Proxy на Frontend, Backend и Node Daemon
server {
    server_name cs2.hfl-nodes.pro www.cs2.hfl-nodes.pro;
    listen 31.77.8.9:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/cs2.hfl-nodes.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs2.hfl-nodes.pro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Node Daemon API & Direct WebSocket for Real-time Console logs (8888)
    location /daemon/ {
        proxy_pass http://cs2_daemon/;
        proxy_http_version 1.1;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Backend API -> Laravel (8005)
    location ~ ^/(api|auth|agent-gateway|sanctum|broadcasting|storage)/ {
        proxy_pass http://cs2_backend;
        proxy_http_version 1.1;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Frontend -> Next.js (3002)
    location / {
        proxy_pass http://cs2_frontend;
        proxy_http_version 1.1;

        # WebSockets / HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Кэш статики Next.js
    location /_next/static/ {
        proxy_pass http://cs2_frontend;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }
}
