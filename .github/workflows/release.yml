name: Auto Release & Package

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Semver Version
        id: version
        run: |
          # Fetch all tags
          git fetch --tags
          
          # Get highest tag
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          NEW_TAG=""

          # 1. Check if explicit VERSION file is set and tag does not exist
          if [ -f VERSION ]; then
            SPECIFIED_VER=$(cat VERSION | tr -d '[:space:]')
            if [ -n "$SPECIFIED_VER" ]; then
              SPECIFIED_TAG="v${SPECIFIED_VER#v}"
              if ! git tag -l "$SPECIFIED_TAG" | grep -q "^${SPECIFIED_TAG}$"; then
                NEW_TAG="$SPECIFIED_TAG"
              fi
            fi
          fi

          # 2. If no new tag from VERSION file, increment based on custom rollover (up to .30 then x.(x+1).1)
          if [ -z "$NEW_TAG" ]; then
            if [ -z "$LATEST_TAG" ]; then
              NEW_TAG="v1.3.0"
            else
              VER="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
              
              MAJOR=${MAJOR:-1}
              MINOR=${MINOR:-3}
              PATCH=${PATCH:-0}
              
              if [ "$PATCH" -ge 30 ]; then
                NEW_MINOR=$((MINOR + 1))
                NEW_PATCH=1
                NEW_TAG="v${MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
              else
                NEW_PATCH=$((PATCH + 1))
                NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              fi
            fi
          fi
          
          echo "tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "Calculated new version tag: ${NEW_TAG}"
          echo "${NEW_TAG}" > version.txt

      - name: Setup PHP 8.2 & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl, zip
          coverage: none

      - name: Install Backend Production Dependencies
        working-directory: backend
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Assets
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build CS2 Deployer, Node Daemon & AI Agent Binaries
        run: |
          mkdir -p bin
          
          # 1. CS2 Deployer
          cd cs2deployer
          go mod tidy || true
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.DefaultVersion=${{ steps.version.outputs.tag }}" -o ../bin/cs2deployer-linux-amd64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.DefaultVersion=${{ steps.version.outputs.tag }}" -o ../bin/cs2deployer-windows-amd64.exe .
          cd ..

          # 2. CS2 Node Daemon
          if [ -d daemon ]; then
            cd daemon
            go mod tidy || true
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../bin/cs2daemon-linux-amd64 .
            cd ..
          fi

          # 3. CS2 AI Client Agent
          if [ -d client-agent ]; then
            cd client-agent
            go mod tidy || true
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../bin/cs2agent-linux-amd64 .
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../bin/cs2agent-windows-amd64.exe .
            cd ..
          fi

      - name: Create Release Package Archive
        run: |
          mkdir -p dist/package
          
          # Copy backend without sqlite database or .env
          mkdir -p dist/package/backend
          rsync -av --exclude='database/database.sqlite*' --exclude='.env' --exclude='storage/logs/*' backend/ dist/package/backend/
          
          # Copy frontend without node_modules
          mkdir -p dist/package/frontend
          rsync -av --exclude='node_modules' frontend/ dist/package/frontend/
          
          # Copy daemon with fresh binary, nginx & scripts & root files
          if [ -d daemon ]; then
            cp -r daemon dist/package/
            if [ -f bin/cs2daemon-linux-amd64 ]; then
              cp -f bin/cs2daemon-linux-amd64 dist/package/daemon/cs2daemon-linux-amd64
              chmod +x dist/package/daemon/cs2daemon-linux-amd64
            fi
          fi
          if [ -d nginx ]; then cp -r nginx dist/package/; fi
          cp version.txt dist/package/
          if [ -f docker-compose.yml ]; then cp docker-compose.yml dist/package/; fi
          if [ -f Makefile ]; then cp Makefile dist/package/; fi
          if [ -f README.md ]; then cp README.md dist/package/; fi
          
          # Create zip & tar.gz archives
          cd dist/package
          zip -r ../../cs2panel-server.zip .
          tar -czf ../../cs2panel-server.tar.gz .
          cd ../..

      - name: Create Git Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CS2Panel Release ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            cs2panel-server.zip
            cs2panel-server.tar.gz
            bin/cs2deployer-windows-amd64.exe
            bin/cs2deployer-linux-amd64
            bin/cs2daemon-linux-amd64
            bin/cs2agent-linux-amd64
            bin/cs2agent-windows-amd64.exe
            version.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
